---
name: Deploy UI to GitHub Pages

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - 'src/ui/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-ui-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout The Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install UI dependencies
        run: npm install --prefix src/ui

      - name: Run UI unit tests
        run: npm test --prefix src/ui

      - name: Read UI version
        id: version
        run: |
          version=$(node -p "require('./src/ui/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Astro UI
        env:
          PUBLIC_API_URL: https://ghwm-deployment-prd.ghwfxlab.workers.dev
          ASTRO_SITE: https://ghwfxlab.github.io
          ASTRO_BASE: /ghwm
        run: |
          npm run build --prefix src/ui
          touch src/ui/dist/.nojekyll

      - name: Upload dist artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9926d141 # v4.6.1
        with:
          name: ui-dist
          path: src/ui/dist/
          retention-days: 7

  deploy:
    name: Deploy to GHWM GitHub Pages & Release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - name: Generate GH App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ghwfxlab
          repositories: ghwm

      - name: Download UI dist artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: ui-dist
          path: dist

      - name: Deploy to gh-pages branch in ghwm
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          UI_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: UI release v${UI_VERSION} from ghwm-registry@${GITHUB_SHA}"
          git push --force "https://x-access-token:${DEPLOY_TOKEN}@github.com/ghwfxlab/ghwm.git" gh-pages

      - name: Create UI Release in ghwm
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ghwfxlab/ghwm
          target_commitish: gh-pages
          tag_name: ui-v${{ needs.build.outputs.version }}
          name: UI Release v${{ needs.build.outputs.version }}
          body: |
            Automated release of the GHWM Registry UI deployed to GitHub Pages (`gh-pages`).

            - **Live Site**: https://ghwfxlab.github.io/ghwm/
            - **Source Commit**: https://github.com/ghwfxlab/ghwm-registry/commit/${{ github.sha }}
            - **API Target**: Production (`https://ghwm-deployment-prd.ghwfxlab.workers.dev`)
          generate_release_notes: false
          prerelease: false
