---
name: Deploy UI to GitHub Pages

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - 'src/ui/**'
      - 'workflows/**'
      - 'scripts/sync-catalog.mjs'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-ui-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout The Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install UI dependencies
        run: npm install --prefix src/ui

      - name: Run UI unit tests
        run: npm test --prefix src/ui

      - name: Read UI version
        id: version
        run: |
          version=$(node -p "require('./src/ui/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync workflow catalog to telemetry API
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          PUBLIC_API_URL: https://ghwm-deployment-prd.ghwfxlab.workers.dev
        run: node scripts/sync-catalog.mjs

      - name: Build Astro UI
        env:
          PUBLIC_API_URL: https://ghwm-deployment-prd.ghwfxlab.workers.dev
          ASTRO_SITE: https://ghwfxlab.github.io
          ASTRO_BASE: /ghwm
        run: |
          npm run build --prefix src/ui
          touch src/ui/dist/.nojekyll

      - name: Generate GH App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ghwfxlab
          repositories: ghwm
          permission-contents: write

      - name: Deploy to gh-pages branch in ghwm
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
          UI_VERSION: ${{ steps.version.outputs.version }}
        run: | # zizmor: ignore[template-injection]
          cd src/ui/dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: UI release v${UI_VERSION} from ghwm-registry@${GITHUB_SHA}"
          git push --force "https://x-access-token:${DEPLOY_TOKEN}@github.com/ghwfxlab/ghwm.git" gh-pages
