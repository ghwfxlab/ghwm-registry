# ---
# title: Auto Assign PR
# description: Automatically add pull request reviewers and assignees to streamline pull request triage and reviews.
# tags:
#   - automation
#   - pr
#   - review
# icon: person_add
# owner: ghwfxlab
# ---
---
name: Add Reviewers and Assignees

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - ready_for_review

permissions: {}

jobs:
  # Every job reads its runner from the AUTO_ASSIGN_PR_RUNS_ON repository (or organisation) variable, then from
  # the RUNS_ON variable, as JSON:
  # unset runs on GitHub-hosted ubuntu-slim, "my-runner" or ["self-hosted", "linux"] runs on your own runners.
  # It is a variable, not an env value, because runs-on cannot read the workflow env.
  add-reviews:
    name: Add PR Reviewers and Assignees
    runs-on: ${{ fromJSON(vars.AUTO_ASSIGN_PR_RUNS_ON || vars.RUNS_ON || '"ubuntu-slim"') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
        with:
          configuration-path: .github/auto_assign.yaml
