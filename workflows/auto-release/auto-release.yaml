---
name: Auto Release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  check-paths:
    name: Check External Path Filters
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run_release: ${{ steps.filter.outputs.run_release }}
    steps:
      - name: Checkout The Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate external path rules
        id: filter
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          CONFIG_FILES=()
          for file in ".github/auto-release.yaml" ".github/auto-release.yml" ".github/auto-release.json"; do
            if [ -f "$file" ]; then
              CONFIG_FILES+=("$file")
            fi
          done

          if [ ${#CONFIG_FILES[@]} -gt 1 ]; then
            echo "::error::Multiple config files found (${CONFIG_FILES[*]}). Keep only one."
            exit 1
          fi

          PATTERNS=()
          if [ ${#CONFIG_FILES[@]} -eq 0 ]; then
            echo "Config file not found, defaulting execution to true."
          else
            CONFIG_FILE="${CONFIG_FILES[0]}"
            PATTERNS_RAW=$(python3 -c 'import sys, json, textwrap
          code = textwrap.dedent("""
          config_file = sys.argv[1]
          with open(config_file, "r", encoding="utf-8") as file_handle:
              content = file_handle.read().strip()
          if content:
              data = json.loads(content) if config_file.endswith(".json") else __import__("yaml").safe_load(content)
              paths = data.get("paths", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
              for pattern in paths:
                  if pattern and isinstance(pattern, str) and not pattern.startswith("#"):
                      print(pattern.strip())
          """)
          exec(code)
          ' "$CONFIG_FILE")

            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              if [[ "$pattern" =~ ^:\( ]]; then
                PATTERNS+=("$pattern")
              else
                PATTERNS+=(":(glob)$pattern")
              fi
            done <<< "$PATTERNS_RAW"
          fi

          if [ ${#PATTERNS[@]} -eq 0 ]; then
            echo "No filter patterns defined, running release for all pushes."
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$EVENT_BEFORE" ]; then
            MATCHED=$(git diff-tree --root --no-commit-id --name-only -r "$EVENT_SHA" -- "${PATTERNS[@]}")
          else
            MATCHED=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- "${PATTERNS[@]}")
          fi

          if [ -n "$MATCHED" ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "Matched paths:"
            echo "$MATCHED"
          else
            echo "run_release=false" >> "$GITHUB_OUTPUT"
            echo "No matching paths changed."
          fi

  release:
    name: Tag and Release
    needs: check-paths
    if: needs.check-paths.outputs.run_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump-version.outputs.new_tag }}
    environment:
      name: production
      deployment: false
    steps:
      - name: Check for GitHub App credentials
        id: check-app-token
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$GH_APP_ID" ] && [ -n "$GH_APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GH App token
        id: app-token
        if: steps.check-app-token.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write

      - name: Checkout The Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bump version and push tag
        id: bump-version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG_PREFIX: ${{ vars.AUTO_RELEASE_TAG_PREFIX || 'v' }}
          DEFAULT_BUMP: ${{ vars.AUTO_RELEASE_DEFAULT_BUMP || 'patch' }}
          PRERELEASE: ${{ vars.AUTO_RELEASE_PRERELEASE || 'false' }}

      - name: automatic-release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.bump-version.outputs.new_tag }}
          generate_release_notes: ${{ vars.AUTO_RELEASE_GENERATE_NOTES || 'true' }}
          prerelease: ${{ vars.AUTO_RELEASE_PRERELEASE || 'false' }}
