# ---
# title: Super-Linter
# description: Code linting workflow using Super-Linter and pre-commit hooks for code quality.
# tags:
#   - lint
#   - actions
#   - pre-commit
# icon: fact_check
# owner: ghwfxlab
# ---
---
name: Lint Code Base

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

env:
  # Set the default value for the input variable
  PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH: ""
  SUPER_LINTER_CONFIG_PATH: .github/super-linter.env
  SUPER_LINTER_FIX_CONFIG_PATH: .github/super-linter-fix.env
  RUN_SUPER_LINTER_SLIM: true
  RUN_SUPER_LINTER_FIXES: false

jobs:
  super-linter:
    name: Run Super-Linter
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      statuses: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load Super-Linter configuration
        run: |
          echo "Loading Super-Linter configuration from ${{ env.SUPER_LINTER_CONFIG_PATH }}"
          grep -v '^#' ${{ env.SUPER_LINTER_CONFIG_PATH }} >> "$GITHUB_ENV"
      - name: Load Super-Linter Fix configuration
        if: ${{ env.RUN_SUPER_LINTER_FIXES == 'true' }}
        run: |
          echo "Loading Super-Linter Fix configuration from ${{ env.SUPER_LINTER_FIX_CONFIG_PATH }}"
          grep -v '^#' ${{ env.SUPER_LINTER_FIX_CONFIG_PATH }} >> "$GITHUB_ENV"
      - name: Run custom scripts before linting
        if: ${{ env.PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH != '' }}
        run: |
          echo "Running custom script from ${{ env.PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH }}..."
          ${{ env.PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH }}
      - name: Run Slim Super-Linter
        if: ${{ env.RUN_SUPER_LINTER_SLIM == 'true' }}
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Super-Linter
        if: ${{ env.RUN_SUPER_LINTER_SLIM != 'true' }}
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push linting fixes
        # Run only on:
        # - Pull requests
        # - Not on the default branch
        if: >
          github.event_name == 'pull_request' &&
          github.ref_name != github.event.repository.default_branch && env.RUN_SUPER_LINTER_FIXES == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref }}
          commit_message: "chore[BOT]: fix linter issues"
          commit_user_email: github-actions[bot]@users.noreply.github.com
