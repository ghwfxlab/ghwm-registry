# ---
# title: Super-Linter
# description: Code linting workflow using Super-Linter and pre-commit hooks for code quality.
# tags:
#   - lint
#   - actions
#   - pre-commit
# icon: fact_check
# owner: ghwfxlab
# ---
---
name: Lint Code Base

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

env:
  # Set the default value for the input variable
  PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH: ""
  SUPER_LINTER_CONFIG_PATH: .github/super-linter.env
  SUPER_LINTER_FIX_CONFIG_PATH: .github/super-linter-fix.env
  RUN_SUPER_LINTER_SLIM: true
  RUN_SUPER_LINTER_FIXES: false
  # Settings of this workflow (SUPER_LINTER_CUSTOM_IMAGE, RUN_SUPER_LINTER_CUSTOM_DRIFT_CHECK), read by the setup job
  SUPER_LINTER_WORKFLOW_CONFIG_PATH: .github/super-linter-workflow.env

jobs:
  # Decide which Super-Linter job runs. A job skipped by its `if:` never starts, so the runner does not pull
  # its image; one job with several `uses:` steps would pull the image of every step, skipped ones included.
  setup:
    name: Select Super-Linter
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run_slim: ${{ env.RUN_SUPER_LINTER_SLIM }}
      custom_image: ${{ steps.workflow-config.outputs.custom_image }}
      drift_check: ${{ steps.workflow-config.outputs.drift_check }}
    steps:
      - name: Checkout workflow configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Read workflow configuration
        id: workflow-config
        run: |
          value() { sed -n "s/^$1=//p" "${SUPER_LINTER_WORKFLOW_CONFIG_PATH}" | tail -n 1; }
          custom_image=""
          drift_check="false"
          if [ -f "${SUPER_LINTER_WORKFLOW_CONFIG_PATH}" ]; then
            echo "Loading workflow configuration from ${SUPER_LINTER_WORKFLOW_CONFIG_PATH}"
            custom_image="$(value SUPER_LINTER_CUSTOM_IMAGE)"
            drift_check="$(value RUN_SUPER_LINTER_CUSTOM_DRIFT_CHECK)"
          fi
          echo "custom_image=${custom_image}" >> "$GITHUB_OUTPUT"
          echo "drift_check=${drift_check:-false}" >> "$GITHUB_OUTPUT"
          if [ -n "${custom_image}" ]; then
            echo "Super-Linter image: \`${custom_image}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The three lint jobs share one display name, so a required check named "Run Super-Linter" keeps working.
  super-linter-slim:
    name: Run Super-Linter
    needs: setup
    if: ${{ needs.setup.outputs.custom_image == '' && needs.setup.outputs.run_slim == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      statuses: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Super-Linter
        uses: ./.github/actions/super-linter-prepare
        with:
          config-path: ${{ env.SUPER_LINTER_CONFIG_PATH }}
          fix-config-path: ${{ env.SUPER_LINTER_FIX_CONFIG_PATH }}
          run-fixes: ${{ env.RUN_SUPER_LINTER_FIXES }}
          pre-script-path: ${{ env.PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH }}
      - name: Run Slim Super-Linter
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push linting fixes
        uses: ./.github/actions/super-linter-commit-fixes
        with:
          run-fixes: ${{ env.RUN_SUPER_LINTER_FIXES }}

  super-linter:
    name: Run Super-Linter
    needs: setup
    if: ${{ needs.setup.outputs.custom_image == '' && needs.setup.outputs.run_slim != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      statuses: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Super-Linter
        uses: ./.github/actions/super-linter-prepare
        with:
          config-path: ${{ env.SUPER_LINTER_CONFIG_PATH }}
          fix-config-path: ${{ env.SUPER_LINTER_FIX_CONFIG_PATH }}
          run-fixes: ${{ env.RUN_SUPER_LINTER_FIXES }}
          pre-script-path: ${{ env.PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH }}
      - name: Run Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push linting fixes
        uses: ./.github/actions/super-linter-commit-fixes
        with:
          run-fixes: ${{ env.RUN_SUPER_LINTER_FIXES }}

  super-linter-custom:
    name: Run Super-Linter
    needs: setup
    if: ${{ needs.setup.outputs.custom_image != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      statuses: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Super-Linter
        uses: ./.github/actions/super-linter-prepare
        with:
          config-path: ${{ env.SUPER_LINTER_CONFIG_PATH }}
          fix-config-path: ${{ env.SUPER_LINTER_FIX_CONFIG_PATH }}
          run-fixes: ${{ env.RUN_SUPER_LINTER_FIXES }}
          pre-script-path: ${{ env.PRE_SUPER_LINTER_CUSTOM_SCRIPT_PATH }}
      - name: Install uv for the drift check
        if: ${{ needs.setup.outputs.drift_check == 'true' && github.event_name == 'pull_request' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the changed files against the lean image
        if: ${{ needs.setup.outputs.drift_check == 'true' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The lean image only has the linters the env file enables; fail when a changed file needs another one.
          report="${RUNNER_TEMP}/drift.md"
          status=0
          uvx --from "superlint-lean==0.0.9" superlint-lean drift \
            --env "${SUPER_LINTER_CONFIG_PATH}" --root . --base "origin/${BASE_REF}" --report "${report}" || status=$?
          cat "${report}" >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"
      # A plain docker run, not a `uses: docker://` step: the runner pulls the image of every action step when the
      # job starts, before any login, so an action step cannot use a private registry and the image cannot come from
      # a file. The login uses a temporary Docker config so a stale token never stays on a self-hosted runner.
      - name: Run the custom Super-Linter image
        env:
          SUPER_LINTER_CUSTOM_IMAGE: ${{ needs.setup.outputs.custom_image }}
          # The workflow token is only ever sent to ghcr.io; other registries need the secrets.
          REGISTRY_USERNAME: ${{ secrets.SUPER_LINTER_REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.SUPER_LINTER_REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          host="${SUPER_LINTER_CUSTOM_IMAGE%%/*}"
          case "${host}" in
            *.* | *:* | localhost) ;;
            *) host="" ;;
          esac
          if [ -z "${REGISTRY_PASSWORD}" ] && [ "${host}" = "ghcr.io" ]; then
            REGISTRY_PASSWORD="${GITHUB_TOKEN}"
          fi
          if [ -n "${REGISTRY_PASSWORD}" ]; then
            printf '%s' "${REGISTRY_PASSWORD}" |
              docker login ${host:+"${host}"} --username "${REGISTRY_USERNAME}" --password-stdin
          fi
          echo "Super-Linter image: \`${SUPER_LINTER_CUSTOM_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          # Mirror a container action: pass GITHUB_* through, mount the workspace and the file commands.
          args=(--rm --workdir /github/workspace --env-file "${SUPER_LINTER_CONFIG_PATH}")
          if [ "${RUN_SUPER_LINTER_FIXES}" = "true" ]; then
            args+=(--env-file "${SUPER_LINTER_FIX_CONFIG_PATH}")
          fi
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_ENV | GITHUB_OUTPUT | GITHUB_PATH | GITHUB_STATE | GITHUB_STEP_SUMMARY) ;;
              GITHUB_WORKSPACE | GITHUB_EVENT_PATH) ;;
              GITHUB_* | RUNNER_* | DEFAULT_BRANCH) args+=(--env "${name}") ;;
            esac
          done < <(env)
          args+=(
            --env CI=true
            --env GITHUB_ACTIONS=true
            --env GITHUB_WORKSPACE=/github/workspace
            --env GITHUB_EVENT_PATH="/github/workflow/$(basename "${GITHUB_EVENT_PATH}")"
            --env GITHUB_ENV="/github/file_commands/$(basename "${GITHUB_ENV}")"
            --env GITHUB_OUTPUT="/github/file_commands/$(basename "${GITHUB_OUTPUT}")"
            --env GITHUB_PATH="/github/file_commands/$(basename "${GITHUB_PATH}")"
            --env GITHUB_STATE="/github/file_commands/$(basename "${GITHUB_STATE}")"
            --env GITHUB_STEP_SUMMARY="/github/file_commands/$(basename "${GITHUB_STEP_SUMMARY}")"
            --volume "${GITHUB_WORKSPACE}:/github/workspace"
            --volume "$(dirname "${GITHUB_EVENT_PATH}"):/github/workflow"
            --volume "$(dirname "${GITHUB_OUTPUT}"):/github/file_commands"
          )
          docker run "${args[@]}" "${SUPER_LINTER_CUSTOM_IMAGE}"
      - name: Commit and push linting fixes
        uses: ./.github/actions/super-linter-commit-fixes
        with:
          run-fixes: ${{ env.RUN_SUPER_LINTER_FIXES }}
